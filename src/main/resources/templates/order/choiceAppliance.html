<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Choose appliance</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main>
    <h1 th:text="#{appliance.header.list}">Appliances list</h1>

    <th:block th:each="appliance: ${appliances}">
        <form class="store-form d-flex gap-2 mb-2" method="post"
              th:action="@{/orders/{id}/add-into-order(id=${ordersId})}">
            <input type="hidden" th:value="${appliance.id}" th:name="applianceId">
            <span class="w-25" th:text="${appliance.name}"></span>
            <input class="form-control w-auto" th:value="${appliance.price}" readonly/>
            <input class="form-control w-auto" type="number" min="1" required
                   th:name="numbers" th:placeholder="#{object.order.row.number}"/>
            <input class="btn btn-primary" type="submit" th:value="#{btn.add}">
        </form>
    </th:block>
    <a th:href="@{/orders/{id}/edit(id=${ordersId})}" class="btn btn-secondary"
       th:text="#{orders.btn.back.to.order}"></a>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
