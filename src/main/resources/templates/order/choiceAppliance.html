<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Choose appliance</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<main class="container pb-5 mb-5" style="max-width: 720px;">
    <div class="card shadow-sm mt-4">
        <div class="card-body p-4">
            <h1 class="h4 mb-4" th:text="#{appliance.header.list}">Appliances list</h1>

            <div class="d-flex flex-column gap-3">
                <th:block th:each="appliance: ${appliances}">
                    <form class="row g-2 align-items-center border-bottom pb-3" method="post"
                          th:action="@{/orders/{id}/add-into-order(id=${ordersId})}">
                        <input type="hidden" th:value="${appliance.id}" th:name="applianceId">

                        <div class="col-12 col-md-4">
                            <span class="fw-medium" th:text="${appliance.name}"></span>
                        </div>
                        <div class="col-6 col-md-3">
                            <input class="form-control" th:value="${appliance.price}" readonly/>
                        </div>
                        <div class="col-6 col-md-3">
                            <input class="form-control" type="number" min="1" required
                                   th:name="numbers" th:placeholder="#{object.order.row.number}"/>
                        </div>
                        <div class="col-12 col-md-2 text-end">
                            <button type="submit" class="btn btn-primary w-100" th:text="#{btn.add}">Add</button>
                        </div>
                    </form>
                </th:block>
            </div>

            <div class="mt-4">
                <a th:href="@{/orders/{id}/edit(id=${ordersId})}" class="btn btn-outline-secondary"
                   th:text="#{orders.btn.back.to.order}">Back to order</a>
            </div>
        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
