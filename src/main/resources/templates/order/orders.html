<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title>Orders</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main>
    <h1 th:text="#{orders.header.list}">Orders list</h1>

    <div class="alert alert-danger" th:if="${param.lockedError}" th:text="#{error.order.locked}"></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr class="table-dark">
                <th th:text="#{object.order.id}">ID</th>
                <th th:text="#{object.order.client}">Client</th>
                <th th:text="#{object.order.employee}">Employee</th>
                <th th:text="#{object.order.approved}">Approved</th>
                <th th:text="#{object.order.amount}">Amount</th>
                <th th:text="#{operation}">Operation</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>
                <td th:text="${order.clientName}"></td>
                <td th:text="${order.employeeName}"></td>
                <td>
                    <form class="d-inline" method="post" sec:authorize="hasRole('EMPLOYEE')"
                          th:if="${order.approved}"
                          th:action="@{/orders/{id}/unapproved(id=${order.id})}">
                        <button type="submit" class="btn btn-sm btn-success"
                                th:title="#{orders.btn.unapprove}"><i class="fa fa-check"></i></button>
                    </form>
                    <form class="d-inline" method="post" sec:authorize="hasRole('EMPLOYEE')"
                          th:unless="${order.approved}"
                          th:action="@{/orders/{id}/approved(id=${order.id})}">
                        <button type="submit" class="btn btn-sm btn-outline-secondary"
                                th:title="#{orders.btn.approve}"><i class="fa fa-minus"></i></button>
                    </form>
                    <span sec:authorize="!hasRole('EMPLOYEE')">
                        <i th:if="${order.approved}" class="fa fa-check text-success"></i>
                        <i th:unless="${order.approved}" class="fa fa-minus text-secondary"></i>
                    </span>
                </td>
                <td th:text="${order.total}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" th:title="#{btn.edit}"
                       th:href="@{/orders/{id}/edit(id=${order.id})}"><i class="fa fa-edit"></i></a>

                    <form class="d-inline" method="post" th:if="${!order.approved}"
                          th:action="@{/orders/{id}/delete(id=${order.id})}">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                th:title="#{btn.delete}"><i class="fa fa-times"></i></button>
                    </form>
                    <form class="d-inline" method="post" th:if="${order.approved}"
                          sec:authorize="hasRole('EMPLOYEE')"
                          th:action="@{/orders/{id}/delete(id=${order.id})}">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                th:title="#{btn.delete}"><i class="fa fa-times"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <a th:href="@{/orders/add}" class="btn btn-primary" th:text="#{orders.btn.new}"></a>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
