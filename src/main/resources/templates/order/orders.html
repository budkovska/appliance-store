<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title>Orders</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main>
    <h1 th:text="#{orders.header.list}">Orders list</h1>
    <table class="table table-hover">
        <thead>
        <tr class="table-dark">
            <th th:text="#{object.order.id}">ID</th>
            <th th:text="#{object.order.client}">Client</th>
            <th th:text="#{object.order.employee}">Employee</th>
            <th th:text="#{object.order.approved}">Approved</th>
            <th th:text="#{object.order.amount}">Amount</th>
            <th th:text="#{operation}">Operation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order: ${orders}">
            <td><span class="float-end" th:text="${order.id}"></span></td>
            <td><span class="float-end" th:text="${order.clientName}"></span></td>
            <td><span class="float-end" th:text="${order.employeeName}"></span></td>
            <td>
                <div sec:authorize="hasRole('EMPLOYEE')">
                    <a th:if="${order.approved}"
                       th:href="@{/orders/{id}/unapproved(id=${order.id})}">
                        <span class="icon"><i class="fa fa-check"></i></span>
                    </a>
                    <a th:unless="${order.approved}"
                       th:href="@{/orders/{id}/approved(id=${order.id})}">
                        <span class="icon"><i class="fa fa-minus"></i></span>
                    </a>
                </div>
                <div sec:authorize="!hasRole('EMPLOYEE')">
                    <span class="icon" th:if="${order.approved}"><i class="fa fa-check"></i></span>
                    <span class="icon" th:unless="${order.approved}"><i class="fa fa-minus"></i></span>
                </div>
            </td>
            <td><span class="float-end"
                      th:text="${order.total}"></span></td>
            <td>
                <div>
                    <a th:href="@{/orders/{id}/delete(id=${order.id})}">
                        <i class="fa fa-times"></i>
                    </a>
                </div>
                <div>
                    <a th:href="@{/orders/{id}/edit(id=${order.id})}">
                        <i class="fa fa-edit"></i>
                    </a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/orders/add}" class="btn btn-primary" th:text="#{orders.btn.new}"></a>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
