<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>New order</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<main class="container pb-5" style="max-width: 640px;">
    <div class="card shadow-sm mt-4">
        <div class="card-body p-4">
            <h1 class="h4 mb-4" th:text="#{orders.btn.new}">New order</h1>

            <form action="#" th:action="@{/orders/add-order}" method="post">
                <div class="mb-3" sec:authorize="hasRole('EMPLOYEE')">
                    <label class="form-label" for="clientId" th:text="#{object.order.client}">Client</label>
                    <select id="clientId" name="clientId" class="form-select">
                        <option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.name}"></option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{btn.create}">Create</button>
                    <a th:href="@{/orders}" class="btn btn-outline-secondary" th:text="#{btn.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
