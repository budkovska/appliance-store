<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>New order</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1 th:text="#{orders.btn.new}"></h1>
<form action="#" th:action="@{/orders/add-order}" method="post">
    <p sec:authorize="hasRole('EMPLOYEE')">
        <span th:text="#{object.order.client}"></span>
        <select name="clientId">
            <option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.name}"></option>
        </select>
    </p>

    <div class="btn-group">
        <button type="submit" class="btn btn-primary" th:text="#{btn.create}">Create</button>
        <a th:href="@{/orders}" class="btn btn-secondary" th:text="#{btn.cancel}">Cancel</a>
    </div>
</form>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
