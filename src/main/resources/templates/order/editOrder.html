<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Edit order</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1 th:text="#{orders.header.edit}">Edit order</h1>

<div class="alert alert-danger" th:if="${numberError}" th:text="#{error.number.positive}"></div>
<div class="alert alert-danger" th:if="${lockedError}" th:text="#{error.order.locked}"></div>

<div th:object="${order}">
    <p><span th:text="#{object.order.id}"></span>
        <input type="text" th:value="*{id}" disabled/></p>
    <p><span th:text="#{object.order.client}"></span>
        <input type="text" th:value="*{client.name}" disabled/></p>
    <p><span th:text="#{object.order.employee}"></span>
        <input type="text" th:value="*{employee?.name}" disabled/></p>

    <table class="table table-hover">
        <thead>
        <tr class="table-dark">
            <th th:text="#{object.order.row.id}">id</th>
            <th th:text="#{object.order.row.appliance}">Appliance</th>
            <th th:text="#{object.order.row.number}">Number</th>
            <th th:text="#{object.order.row.amount}">Price</th>
            <th th:text="#{operation}">Operation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row: ${rows}">
            <td th:text="${row.id}"></td>
            <td th:text="${row.appliance.name}"></td>
            <td th:text="${row.number}"></td>
            <td th:text="${row.amount}"></td>
            <td>
                <a th:unless="${order.approved}"
                   th:href="@{/orders/{id}/rows/{rowId}/delete(id=${order.id},rowId=${row.id})}">
                    <i class="fa fa-times"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <div>
        <a th:unless="${order.approved}" th:href="@{/orders/{id}/choice-appliance(id=${order.id})}">
            <span th:text="#{orders.btn.add.appliance}">Add</span>
            <i class="fa fa-plus-square-o"></i>
        </a>
    </div>
    <a th:href="@{/orders}" class="btn btn-secondary mt-3" th:text="#{orders.btn.to.orders}"></a>
</div>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
