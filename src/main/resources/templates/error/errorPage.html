<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(code)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title th:with="k=${'error.' + code}" th:text="#{${k + '.title'}}">Error</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<main class="container text-center py-5" th:with="k=${'error.' + code}">
    <div class="display-1 fw-bold text-primary" th:text="${status != null ? status : code}">500</div>
    <h1 class="h3 mt-3" th:text="#{${k + '.title'}}">Something went wrong</h1>
    <p class="text-muted" th:text="#{${k + '.message'}}">Please try again later.</p>
    <a th:href="@{/}" class="btn btn-primary mt-3" th:text="#{error.back.home}">Back to home</a>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
