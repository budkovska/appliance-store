<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Appliance</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<main class="container pb-5" style="max-width: 760px;">
    <div class="card shadow-sm mt-4">
        <div class="card-body p-4">
            <h1 class="h4 mb-4"
                th:text="${appliance.id == null} ? #{appliance.btn.new} : #{appliance.header.edit}"></h1>

            <form th:action="@{/appliances/add-appliance}" th:object="${appliance}" method="post" novalidate>
                <input type="hidden" th:field="*{id}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" id="name" for="name" th:text="#{object.appliance.name}">Name</label>
                        <input type="text" class="form-control" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" id="model" for="model" th:text="#{object.appliance.model}">Model</label>
                        <input type="text" class="form-control" th:field="*{model}"
                               th:classappend="${#fields.hasErrors('model')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{model}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" id="manufacturerId" for="manufacturerId" th:text="#{object.appliance.manufacturer}">Manufacturer</label>
                        <select class="form-select" th:field="*{manufacturerId}"
                                th:classappend="${#fields.hasErrors('manufacturerId')} ? 'is-invalid'">
                            <option value="" th:text="#{select.placeholder}">-- select --</option>
                            <option th:each="m : ${manufacturers}" th:value="${m.id}" th:text="${m.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{manufacturerId}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label" id="category" for="category" th:text="#{object.appliance.category}">Category</label>
                        <select class="form-select" th:field="*{category}"
                                th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                            <option value="" th:text="#{select.placeholder}">-- select --</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{category}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label" id="powerType" for="powerType" th:text="#{object.appliance.powerType}">Power type</label>
                        <select class="form-select" th:field="*{powerType}"
                                th:classappend="${#fields.hasErrors('powerType')} ? 'is-invalid'">
                            <option value="" th:text="#{select.placeholder}">-- select --</option>
                            <option th:each="p : ${powerTypes}" th:value="${p}" th:text="${p}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{powerType}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" id="power" for="power" th:text="#{object.appliance.power}">Power</label>
                        <input type="number" min="1" class="form-control" th:field="*{power}"
                               th:classappend="${#fields.hasErrors('power')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{power}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" id="price" for="price" th:text="#{object.appliance.price}">Price</label>
                        <input type="number" min="0.01" step="0.01" class="form-control" th:field="*{price}"
                               th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{price}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" id="characteristic" for="characteristic" th:text="#{object.appliance.characteristic}">Characteristic</label>
                        <input type="text" class="form-control" th:field="*{characteristic}"
                               th:classappend="${#fields.hasErrors('characteristic')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{characteristic}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" id="description" for="description" th:text="#{object.appliance.description}">Description</label>
                        <textarea class="form-control" rows="3" th:field="*{description}"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary" th:text="#{btn.submit}">Submit</button>
                    <a th:href="@{/appliances}" class="btn btn-outline-secondary" th:text="#{btn.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
