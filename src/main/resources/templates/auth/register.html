<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title th:text="#{register.title}">Create account</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<main class="container pb-5" style="max-width: 520px;">
    <div class="card shadow-sm mt-4">
        <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center" th:text="#{register.title}">Create account</h1>

            <form th:action="@{/register}" th:object="${registration}" method="post" novalidate>

                <div class="mb-3">
                    <label class="form-label" for="name" th:text="#{object.user.name}">Name</label>
                    <input type="text" class="form-control" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email" th:text="#{object.user.email}">Email</label>
                    <input type="email" class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password" th:text="#{object.user.password}">Password</label>
                    <input type="password" class="form-control" th:field="*{password}" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                    <div class="form-text" th:text="#{validation.password.strong}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="confirmPassword" th:text="#{object.user.confirmPassword}">Confirm password</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="card" th:text="#{object.client.card}">Card</label>
                    <input type="text" class="form-control" th:field="*{card}"
                           th:classappend="${#fields.hasErrors('card')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{card}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100" th:text="#{register.submit}">Register</button>
            </form>

            <p class="text-center mt-3 mb-0">
                <a th:href="@{/login}" th:text="#{register.login.link}">Already have an account? Sign in</a>
            </p>
        </div>
    </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
