<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title th:text="#{login.title}">Sign in</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<main class="container" style="max-width: 420px;">
    <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center" th:text="#{login.title}">Sign in</h1>

            <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}"></div>
            <div class="alert alert-warning" th:if="${param.locked}" th:text="#{login.locked}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label" th:text="#{object.user.email}">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" th:text="#{object.user.password}">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" th:text="#{login.submit}">Sign in</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
