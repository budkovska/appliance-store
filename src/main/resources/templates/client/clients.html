<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title>Clients list</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1 th:text="#{client.header.list}"></h1>

<div class="alert alert-danger" th:if="${param.deleteError}" th:text="#{error.delete.related}"></div>

<table class="table table-hover">
    <thead>
    <tr class="table-dark">
        <th th:text="#{object.user.id}"></th>
        <th th:text="#{object.user.name}"></th>
        <th th:text="#{object.user.email}"></th>
        <th th:text="#{object.client.card}"></th>
        <th th:text="#{operation}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}">
        <td th:text="${client.id}"></td>
        <td th:text="${client.name}"></td>
        <td th:text="${client.email}"></td>
        <td th:text="${client.card}"></td>
        <td>
            <a class="btn btn-sm btn-outline-primary"
               th:href="@{/clients/{id}/edit(id=${client.id})}" th:text="#{btn.edit}"></a>
            <form class="d-inline" method="post"
                  th:action="@{/clients/{id}/delete(id=${client.id})}">
                <button class="btn btn-sm btn-outline-danger" th:text="#{btn.delete}"></button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/clients/add}" class="btn btn-primary" th:text="#{client.btn.new}">New client</a>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
