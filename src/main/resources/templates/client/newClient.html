<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Client</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<main class="container pb-5" style="max-width: 640px;">
    <div class="card shadow-sm mt-4">
        <div class="card-body p-4">
            <h1 class="h4 mb-4"
                th:text="${client.id == null} ? #{client.btn.new} : #{client.header.edit}"></h1>

            <form th:action="@{/clients/add-client}" th:object="${client}" method="post" novalidate>
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label" id="name" for="name" th:text="#{object.user.name}">Name</label>
                    <input type="text" class="form-control" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" id="email" for="email" th:text="#{object.user.email}">Email</label>
                    <input type="email" class="form-control" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" id="password" for="password" th:text="#{object.user.password}">Password</label>
                    <input type="password" class="form-control" th:field="*{password}" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                    <div class="form-text" th:if="${client.id != null}" th:text="#{password.hint.edit}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" id="card" for="card" th:text="#{object.client.card}">Card</label>
                    <input type="text" class="form-control" th:field="*{card}"
                           th:classappend="${#fields.hasErrors('card')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{card}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{btn.submit}">Submit</button>
                    <a th:href="@{/clients}" class="btn btn-outline-secondary" th:text="#{btn.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
