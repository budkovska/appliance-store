<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Manufacturer</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<main class="container pb-5" style="max-width: 640px;">
    <div class="card shadow-sm mt-4">
        <div class="card-body p-4">
            <h1 class="h4 mb-4"
                th:text="${manufacturer.id == null} ? #{manufacturer.btn.new} : #{manufacturer.header.edit}"></h1>

            <form th:action="@{/manufacturers/add-manufacturer}" th:object="${manufacturer}"
                  method="post" novalidate>
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label" id="name" for="name" th:text="#{object.manufacturer.name}">Name</label>
                    <input type="text" class="form-control" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{btn.submit}">Submit</button>
                    <a th:href="@{/manufacturers}" class="btn btn-outline-secondary" th:text="#{btn.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
