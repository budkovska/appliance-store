<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Manufacturers list</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<main class="container-fluid pb-5">
    <h1 class="my-3" th:text="#{manufacturer.header.list}"></h1>
    <div class="alert alert-danger" th:if="${param.deleteError}" th:text="#{error.in.use}"></div>

    <form class="row g-2 mb-3" method="get" th:action="@{/manufacturers}">
        <div class="col-sm-8 col-md-6">
            <input type="search" class="form-control" name="search" maxlength="100"
                   th:value="${q.search}" th:placeholder="#{search.placeholder.manufacturers}">
        </div>
        <input type="hidden" name="size" th:value="${q.size}">
        <input type="hidden" name="sort" th:value="${q.sort}">
        <input type="hidden" name="dir" th:value="${q.dir}">
        <div class="col-auto">
            <button type="submit" class="btn btn-primary" th:text="#{search.btn}">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/manufacturers}" th:text="#{search.reset}">Reset</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr class="table-dark">
                <th th:replace="~{fragments/list :: sortHeader(#{object.manufacturer.id}, 'id', '/manufacturers')}"></th>
                <th th:replace="~{fragments/list :: sortHeader(#{object.manufacturer.name}, 'name', '/manufacturers')}"></th>
                <th th:text="#{operation}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="manufacturer : ${manufacturers}">
                <td th:text="${manufacturer.id}"></td>
                <td th:text="${manufacturer.name}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/manufacturers/{id}/edit(id=${manufacturer.id})}" th:text="#{btn.edit}"></a>
                    <form class="d-inline" method="post"
                          th:action="@{/manufacturers/{id}/delete(id=${manufacturer.id})}">
                        <button class="btn btn-sm btn-outline-danger" th:text="#{btn.delete}"></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(manufacturers)}">
                <td colspan="3" class="text-center text-muted py-4" th:text="#{pagination.empty}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/list :: pagination('/manufacturers')}"></div>

    <a th:href="@{/manufacturers/add}" class="btn btn-primary mt-3" th:text="#{manufacturer.btn.new}"></a>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
