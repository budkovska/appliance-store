<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Manufacturers list</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1 th:text="#{manufacturer.header.list}"></h1>
<div class="alert alert-danger" th:if="${deleteError}" th:text="#{error.in.use}"></div>
<table class="table table-hover">
    <thead>
    <tr class="table-dark">
        <th th:text="#{object.manufacturer.id}">ID</th>
        <th th:text="#{object.manufacturer.name}">Name</th>
        <th th:text="#{operation}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="manufacturer: ${manufacturers}">
        <td th:text="${manufacturer.id}"/>
        <td th:text="${manufacturer.name}"/>
        <td>
            <a class="btn btn-sm btn-outline-primary"
               th:href="@{/manufacturers/{id}/edit(id=${manufacturer.id})}" th:text="#{btn.edit}"></a>
            <form class="d-inline" method="post"
                  th:action="@{/manufacturers/{id}/delete(id=${manufacturer.id})}">
                <button class="btn btn-sm btn-outline-danger" th:text="#{btn.delete}"></button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<a th:href="@{/manufacturers/add}" class="btn btn-primary" th:text="#{manufacturer.btn.new}"></a>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
