<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title th:text="#{shop.name}">Appliance store</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>

<main class="flex-grow-1 container my-5">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm border text-center">
        <h1 class="display-5 fw-bold text-primary mb-3" th:text="#{shop.name}">Appliance store</h1>
        <p class="col-md-8 mx-auto fs-5 text-muted" th:text="#{shop.welcome.subtitle}">
            Ласкаво просимо до нашого інтернет-магазину! Обирайте якісну побутову техніку...
        </p>
        <div class="d-flex justify-content-center gap-3 mt-4">
            <a class="btn btn-primary btn-lg px-4" th:href="@{/appliances}">
                <i class="fa fa-shopping-cart me-2"></i> <span th:text="#{appliances.menu.name}">Каталог</span>
            </a>
            <a class="btn btn-outline-secondary btn-lg px-4" th:href="@{/orders}">
                <i class="fa fa-list-alt me-2"></i> <span th:text="#{order.menu.name}">Мої замовлення</span>
            </a>
        </div>
    </div>

    <div class="row g-4 py-2">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body text-center p-4 d-flex flex-column">
                    <div class="text-primary fs-1 mb-3"><i class="fa fa-tv"></i></div>
                    <h3 class="h5 fw-bold" th:text="#{shop.catalog.title}">Каталог</h3>
                    <p class="text-muted small mb-4" th:text="#{shop.catalog.desc}">Широкий асортимент...</p>
                    <div class="mt-auto">
                        <a th:href="@{/appliances}" class="btn btn-outline-primary btn-sm px-3"
                           th:text="#{btn.view}">Переглянути</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body text-center p-4 d-flex flex-column">
                    <div class="text-success fs-1 mb-3"><i class="fa fa-shopping-bag"></i></div>
                    <h3 class="h5 fw-bold" th:text="#{shop.orders.title}">Замовлення</h3>
                    <p class="text-muted small mb-4" th:text="#{shop.orders.desc}">Зручне відстеження...</p>
                    <div class="mt-auto">
                        <a th:href="@{/orders}" class="btn btn-outline-success btn-sm px-3"
                           th:text="#{btn.view}">Переглянути</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body text-center p-4 d-flex flex-column">
                    <div class="text-warning fs-1 mb-3"><i class="fa fa-smile-o"></i></div>
                    <h3 class="h5 fw-bold" th:text="#{shop.service.title}">Сервіс</h3>
                    <p class="text-muted small mb-4" th:text="#{shop.service.desc}">Оперативна обробка...</p>
                    <div class="mt-auto">
                        <a th:href="@{/appliances}" class="btn btn-outline-warning btn-sm px-3"
                           th:text="#{btn.to.shopping}">До покупок</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
