spring.datasource.url=jdbc:h2:mem:store;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true

spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:manufacturer.sql, classpath:client.sql, classpath:employee.sql, classpath:appliance.sql

logging.level.com.epam.rd.autocode.assessment.appliances=DEBUG
logging.level.org.springframework.security=DEBUG

app.jwt.secret=dev-only-secret-key-012345678901234567
app.jwt.cookie-secure=false