spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appliance_store}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.h2.console.enabled=false
spring.jpa.show-sql=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.data-locations=classpath:manufacturer.sql, classpath:client.sql, classpath:employee.sql, classpath:appliance.sql

logging.level.com.epam.rd.autocode.assessment.appliances=INFO

app.jwt.secret=${JWT_SECRET}
app.jwt.cookie-secure=${COOKIE_SECURE:false}